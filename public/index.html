<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remirun Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Remirun</h1>
        <p class="muted">Marathon prep</p>
        <nav>
          <a href="#overview" class="active">Overview</a>
          <a href="#planning">Planning</a>
          <a href="#history">History</a>
        </nav>
      </aside>

      <main class="main">
        <header>
          <h2 id="title">Loading…</h2>
          <p id="stamp" class="muted"></p>
        </header>

        <section class="cards" id="overview"></section>

        <section class="panel" id="planning">
          <h3>Upcoming sessions</h3>
          <div id="planning-list" class="list"></div>
        </section>

        <section class="panel" id="history">
          <h3>Recent activities</h3>
          <div id="history-list" class="list"></div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
